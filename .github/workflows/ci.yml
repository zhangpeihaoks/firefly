name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.26"

jobs:
  # ── Build ──────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go build ./...

  # ── Test (Linux) ───────────────────────────────────────
  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go test ./... -race -count=1 -coverprofile=coverage.out -covermode=atomic
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-linux
          path: coverage.out

  # ── Test (Windows) ─────────────────────────────────────
  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go test ./... -count=1
        # -race is slow on Windows, we rely on Linux for race detection

  # ── Lint ───────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 is required by --new-from-rev below, which diffs
          # against origin/main instead of reporting every historical finding.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      # Version is pinned on purpose: "latest" resolved to a binary built with
      # an older Go, which refuses a go.mod targeting 1.26.2 with
      # "can't load config: the Go language version used to build
      # golangci-lint is lower than the targeted Go version".
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          # Gate only what a change introduces. The 163 findings already on main
          # are tracked separately and must not block every pull request.
          args: --timeout=5m --new-from-rev=origin/main

  # ── Coverage Report ────────────────────────────────────
  coverage:
    name: Coverage
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: coverage-linux
      - run: |
          go tool cover -func=coverage.out | tail -1 | awk '{print "Coverage: " $3}'
      - uses: codacy/codacy-coverage-reporter-action@v1
        if: false  # Enable if Codacy token is configured
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage.out
