# golangci-lint 配置（v2 格式，见 https://golangci-lint.run/docs/configuration/file/）
#
# 与 v1 的差异：
#   - gofmt / goimports 已从 linters 迁到 formatters（v2 把它们当格式化器）
#   - gosimple 合并进 staticcheck，不再单独列出
#   - shadow 是 govet 的分析器，由 settings.govet.enable-all 覆盖，不再单列
version: "2"

run:
  concurrency: 4
  timeout: 5m
  tests: true

linters:
  # 默认集之外一律显式声明，避免升级时静默多出一堆规则
  default: none
  enable:
    - errcheck      # 未处理的错误
    - govet         # 可疑构造（enable-all 覆盖 shadow 等分析器）
    - ineffassign   # 无效赋值
    - misspell      # 常见英文拼写
    - revive        # 快速可配置的 golint 替代
    - staticcheck   # 静态分析（含原 gosimple）
    - unconvert     # 多余的类型转换
    - unused        # 未使用的标识符
  settings:
    govet:
      enable-all: true
      disable:
        # 字段对齐属于微优化：它会要求把字段按大小重排，破坏结构体的阅读顺序
        # （含测试表），而框架里这些结构体都不在热路径上。
        - fieldalignment
  exclusions:
    # 与 v1 保持一致：不额外放行任何目录或规则
    generated: lax

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/zhangpeihaoks/firefly
